<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eksperimen Sains Seru - Seri Anak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#17376b; --orange:#e8793a; --teal:#2fb0d3; --sky1:#dcf4ff; --sky2:#fff7df;
  --wood:#c58f5a; --wood-d:#a46f3d; --board:#4a8274; --board-b:#a87b4f; --card:#fff;
  --pink:#c2417a; --purple:#7a3fa0; --green:#2e9a5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--navy);
  background:linear-gradient(180deg,var(--sky1) 0%,#eefaff 45%,var(--sky2) 100%);background-attachment:fixed;
  padding-bottom:120px;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 0;position:relative}
.dots i{position:fixed;border-radius:50%;background:#9fd8ee;opacity:.55;pointer-events:none;animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* pill */
.pill{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:999px;padding:9px 16px;
  box-shadow:0 4px 14px rgba(23,55,107,.14);font-weight:900;font-size:13px;letter-spacing:.06em;margin:0 auto;width:fit-content;max-width:100%}
.pill b{background:var(--teal);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;letter-spacing:.02em}

/* chalkboard + shelves */
.stage{position:relative;margin-top:16px;min-height:150px}
.board{position:relative;width:62%;margin:0 auto;background:var(--board);border:6px solid var(--board-b);border-radius:12px;padding:12px 14px;color:#fff;
  box-shadow:0 6px 14px rgba(0,0,0,.15);z-index:2}
.board .f{font-weight:900;font-size:clamp(15px,4.6vw,21px)}
.board .t{font-weight:700;font-size:clamp(13px,4vw,18px);opacity:.95;margin-top:4px}
.shelf{position:absolute;bottom:-18px;width:21%;display:flex;flex-direction:column;align-items:center}
.shelf.l{left:0}.shelf.r{right:0}
.tubes{display:flex;gap:4px;align-items:flex-end}
.tube{width:12px;height:56px;border:2px solid #cfe3ee;border-radius:3px 3px 8px 8px;background:#f4fbff;position:relative;overflow:hidden}
.tube span{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 6px 6px;animation:fill 4s ease-in-out infinite}
@keyframes fill{0%,100%{height:48%}50%{height:62%}}
.bar{height:7px;border-radius:5px;background:#b08752;width:100%;margin-top:2px}

h1,h2{margin:0}
.hello{text-align:center;margin-top:34px}
.hello small{display:block;font-weight:900;letter-spacing:.22em;color:var(--teal);font-size:clamp(12px,3.6vw,16px)}
.hello h1{font-size:clamp(34px,10vw,50px);line-height:1.02;font-weight:900;margin-top:4px}
.big{font-size:clamp(38px,12vw,60px);font-weight:900;color:var(--orange);text-align:center;line-height:1;margin:22px 0 14px;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(23,55,107,.12);border:0;font-family:inherit;color:var(--navy);cursor:pointer}
.chip:active{transform:scale(.96)}

/* robot */
.robot{display:block;margin:18px auto 0;width:170px;animation:bob 3s ease-in-out infinite;cursor:pointer}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bulb{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.shadow{width:110px;height:14px;border-radius:50%;background:rgba(23,55,107,.14);margin:-4px auto 0;animation:sh 3s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}

section{margin-top:44px;scroll-margin-top:74px}
.sec-title{font-size:clamp(24px,7.4vw,32px);font-weight:900;text-align:center;line-height:1.1}
.sec-sub{text-align:center;font-weight:700;opacity:.75;margin:6px 0 18px;font-size:14px}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border-radius:18px;padding:12px 10px 14px;box-shadow:0 8px 20px rgba(23,55,107,.13);text-align:center;border:0;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.card:active{transform:scale(.96)}
.card:hover{transform:translateY(-3px)}
.card svg{width:100%;max-width:120px;height:96px}
.card .nm{font-weight:900;font-size:14px;letter-spacing:.01em;text-transform:uppercase}
.card .num{font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:999px;padding:2px 9px}
.card.bonus .num{background:var(--orange)}
.bonus-head{margin:22px 0 12px;text-align:center;font-weight:900;font-size:18px;color:var(--orange)}

/* fakta */
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.flip{perspective:700px;height:150px;cursor:pointer;border:0;background:none;padding:0;font-family:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;box-shadow:0 8px 18px rgba(23,55,107,.13)}
.face.fr{background:#fff;font-weight:900;font-size:16px;flex-direction:column;gap:6px}
.face.fr em{font-style:normal;font-size:30px}
.face.bk{background:var(--teal);color:#fff;transform:rotateY(180deg);font-weight:700;font-size:13.5px;line-height:1.35}

/* kuis */
.quiz{background:#fff;border-radius:22px;padding:20px 16px;box-shadow:0 8px 22px rgba(23,55,107,.13)}
.qprog{height:8px;border-radius:6px;background:#e3f1f7;overflow:hidden;margin-bottom:14px}
.qprog i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
.qtext{font-weight:900;font-size:18px;line-height:1.25;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;font-family:inherit;font-weight:800;font-size:15px;color:var(--navy);background:#eef8fc;border:2px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.opt.ok{background:#d9f5e3;border-color:var(--green)}
.opt.no{background:#ffe1e1;border-color:#d9534f}
.exp{font-weight:700;font-size:14px;background:#fff6dd;border-radius:12px;padding:10px 12px;margin-top:4px;display:none}
.btn{font-family:inherit;font-weight:900;font-size:16px;background:var(--orange);color:#fff;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 5px 0 #b95a22}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b95a22}
.btn.alt{background:var(--teal);box-shadow:0 5px 0 #1a86a3}
.center{text-align:center;margin-top:12px}
.score{font-size:56px;font-weight:900;color:var(--orange);text-align:center}

.safe{margin-top:36px;background:#fff;border-radius:18px;padding:14px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 16px rgba(23,55,107,.1);border-left:6px solid var(--orange)}
.safe b{display:block;font-weight:900;margin-bottom:4px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,30,60,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#e8f8ff,#fff 40%);border-radius:26px 26px 0 0;
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:60;padding:16px 16px 40px;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:46px;height:5px;border-radius:4px;background:#c4d8e2;margin:0 auto 10px}
.x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:#17376b;color:#fff;font-size:20px;font-weight:900;cursor:pointer}
.sheet h3{margin:0 44px 0 0;font-size:24px;font-weight:900;line-height:1.1}
.tagline{font-weight:800;color:var(--teal);font-size:13px;letter-spacing:.06em;margin-bottom:8px}
.demo{position:relative;background:#fff;border-radius:18px;height:190px;margin:12px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px #e3f1f7}
.demo svg{height:150px;width:auto;max-width:90%}
.demo .go{position:absolute;bottom:10px;right:10px;font-size:14px;padding:9px 16px}
.b{position:absolute;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid var(--teal);animation:rise 1.8s ease-out forwards;pointer-events:none}
@keyframes rise{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-150px) scale(1.2);opacity:0}}
.sp{position:absolute;font-size:22px;animation:pop 1.2s ease-out forwards;pointer-events:none}
@keyframes pop{from{transform:scale(.3);opacity:1}to{transform:translateY(-50px) scale(1.3);opacity:0}}
.slide{animation:zoom 1.4s ease-in forwards}
@keyframes zoom{to{transform:translateX(150px)}}
.h{font-weight:900;font-size:16px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.mats{display:flex;flex-wrap:wrap;gap:7px}
.mats span{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13.5px;box-shadow:0 2px 8px rgba(23,55,107,.1)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;font-weight:700;font-size:15px;line-height:1.3;cursor:pointer;
  box-shadow:0 2px 8px rgba(23,55,107,.08);border:2px solid transparent}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.steps li.done{background:#e2f7ea;border-color:var(--green);text-decoration:line-through;opacity:.8}
.steps li.done::before{content:"\2713";background:var(--green)}
.why{background:#fff6dd;border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.4}
.adult{display:inline-block;background:var(--orange);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:12px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}

/* player bar */
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,var(--wood) 0,var(--wood-d) 100%);border-top:5px solid #94622f;padding:10px 14px 14px}
.player .in{max-width:520px;margin:0 auto}
.sub{background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14.5px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.18);min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.ctl{display:flex;align-items:center;gap:12px;margin-top:9px}
.pp{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;display:flex;gap:5px;align-items:center;justify-content:center}
.pp i{width:6px;height:20px;background:#fff;border-radius:2px}
.pp.paused i:first-child{width:0;height:0;background:none;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;border-radius:0}
.pp.paused i:last-child{display:none}
.track{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.4);overflow:hidden}
.track i{display:block;height:100%;width:0;background:#fff;border-radius:6px}


/* ---------- switcher ---------- */
.tabs{position:sticky;top:0;z-index:30;display:flex;gap:6px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);padding:6px;border-radius:999px;box-shadow:0 4px 14px rgba(23,55,107,.14);margin:0 auto 14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap;border:0;font-family:inherit;font-weight:900;font-size:13.5px;padding:10px 14px;border-radius:999px;background:transparent;color:var(--navy);cursor:pointer;transition:background .2s,color .2s}
.tab.on{background:var(--teal);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.view{display:none}.view.on{display:block}

/* ---------- tema Keliling Indonesia ---------- */
body.indo{--navy:#27491f;--teal:#e5484d;--orange:#e07a2f;--pink:#a24a1a;--purple:#7a3fa0;
  background:linear-gradient(180deg,#c9ecff 0%,#e9f8ff 38%,#fdf2c4 72%,#fcecb4 100%);background-attachment:fixed}
body.indo .sec-title,body.indo .hello h1,body.indo .hello small,body.hewan .sec-title,body.hewan .hello h1,body.hewan .hello small{color:#245a1d}
body.hewan .hello small,body.indo .hello small{letter-spacing:.04em;font-size:clamp(20px,6vw,28px)}
body.indo .player{background:linear-gradient(180deg,#4cc3de 0,#2c9cc3 100%);border-top:5px solid #2688ad}
body.indo .track{background:rgba(255,255,255,.4)}
body.indo .sheet{background:linear-gradient(180deg,#dff4ff,#fff 40%)}
body.indo .x{background:#27491f}
.decor{display:none;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
body.indo .d-indo,body.hewan .d-indo{display:block}
body.space .d-space{display:block}
body.space .dots{display:none}
.sun{position:absolute;right:-30px;top:70px;width:130px;height:130px;border-radius:50%;background:#f8c93c;box-shadow:0 0 0 22px rgba(248,201,60,.25);animation:sunp 6s ease-in-out infinite}
@keyframes sunp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.cloud{position:absolute;width:120px;height:34px;border-radius:30px;background:#fff;opacity:.9;filter:blur(1px);animation:cl 28s linear infinite}
.cloud::before{content:"";position:absolute;left:22px;top:-16px;width:56px;height:40px;border-radius:50%;background:#fff}
@keyframes cl{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.isle{position:absolute;bottom:96px}
.isle svg{display:block}
.wrap,.player{position:relative}
.player{position:fixed}
.wrap{z-index:1}
.gara{display:block;margin:18px auto 0;width:190px;animation:bob 3s ease-in-out infinite;cursor:pointer}
.gara.hop{animation:hop .7s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-40px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}100%{transform:none}}
.pill.indo b{background:#e5484d}
.tk{background:#fff;border-radius:22px;padding:20px 16px;box-shadow:0 8px 22px rgba(23,55,107,.13);text-align:center}
.tk .lab{display:inline-block;background:#ffd24d;color:#6b4a00;font-weight:900;border-radius:999px;padding:5px 14px;font-size:13px;letter-spacing:.04em}
.tkq{font-weight:900;font-size:19px;line-height:1.25;margin:12px 0}
.tka{display:none;background:#e8f7e4;border-radius:14px;padding:12px;font-weight:700;font-size:15px;line-height:1.35;margin-bottom:8px}


/* ---------- tema Tata Surya ---------- */
body.space{--navy:#2a1a6b;--teal:#7b61ff;--orange:#ff7b72;
  background:linear-gradient(180deg,#1a1050 0%,#241766 55%,#2b1d6e 100%);background-attachment:fixed;color:#2a1a6b}
body.space .sec-title,body.space .sp-title{color:#fff}
body.space .sec-sub{color:#fff;opacity:.7}
body.space .bonus-head{color:#ffb36b}
body.space .btn{box-shadow:0 5px 0 #c4514a}
body.space .btn.alt{box-shadow:0 5px 0 #5a43c9}
body.space .pill{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:none;margin:0}
body.space .tab.on{box-shadow:0 3px 0 rgba(0,0,0,.2)}
body.space .player{background:linear-gradient(180deg,#2a1b66,#1f1450);border-top:3px solid rgba(255,255,255,.15)}
body.space .sub{background:#d8d0ee;color:#2a1a6b;border:2px solid #e3b05a}
body.space .sheet{color:#2a1a6b}
.d-space i{position:absolute;border-radius:50%;background:#fff;opacity:.8;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.neb{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.35}
.sp-title{font-size:clamp(30px,9vw,42px);font-weight:900;text-align:center;line-height:1.1;margin:0}
.hook{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
.hook .rk{width:150px;animation:bob 3s ease-in-out infinite;cursor:pointer}
.hook .rk.hop{animation:hop .7s ease-out}
.hook .col{display:flex;flex-direction:column;align-items:center;gap:0}
.hook .hp svg{width:100%;display:block}
.flame{animation:fl .5s ease-in-out infinite alternate;transform-origin:70px 146px}
@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
.num10{font-size:clamp(76px,24vw,116px);font-weight:900;text-align:center;line-height:1;margin-top:26px;background:linear-gradient(180deg,#ffb36b,#f58aa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.gobtn{font-family:inherit;font-weight:900;font-size:20px;color:#fff;border:0;border-radius:999px;padding:16px 34px;margin-top:20px;cursor:pointer;background:linear-gradient(90deg,#f7776f,#f88aa0);box-shadow:0 10px 26px rgba(247,119,111,.45)}
.gobtn:active{transform:scale(.97)}
.mmenu{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.mcard{display:flex;align-items:center;gap:14px;background:#fff;border:0;border-radius:18px;padding:16px;text-align:left;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25);color:#2a1a6b}
.mcard .ci{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.mcard b{display:block;font-size:20px;font-weight:900}
.mcard small{display:block;font-size:14px;font-weight:700;color:#6a5aa8;margin-top:2px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.pgrid.two{grid-template-columns:repeat(2,1fr);max-width:260px;margin:0 auto}
.planet{background:none;border:0;padding:0;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.planet .pi{width:100%;max-width:86px;transition:transform .2s}
.planet:active .pi,.planet:hover .pi{transform:scale(1.12)}
.planet .pl{background:#fff;color:#2a1a6b;font-weight:900;font-size:12px;border-radius:999px;padding:4px 9px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pgrid .pi svg{width:100%;display:block;overflow:visible}

body.hewan{--navy:#2f4a1f;--teal:#30a030;--orange:#e0783a;--pink:#a24a1a;background:linear-gradient(180deg,#e8f6de 0%,#fcf2c4 55%,#fee2a0 100%);background-attachment:fixed}
body.hewan .player{background:linear-gradient(180deg,#7ccb52,#4c9f31);border-top:5px solid #3f8a27}
body.hewan .x{background:#26591c}
body.angka{--navy:#3b2a63;--teal:#7a5bb5;--orange:#f2873a;--pink:#d1478a;background:linear-gradient(180deg,#fbeefa,#e9f3ff);background-attachment:fixed}
body.angka .player{background:linear-gradient(180deg,#9a7bd6,#7a5bb5);border-top:5px solid #634a9a}
.card img{width:100%;max-width:120px;height:96px;object-fit:contain}
.demo img{height:150px;width:auto;max-width:90%;object-fit:contain}
.grid>.card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 7px)}
.hewan-m{width:170px;height:auto;display:block;margin:14px auto 0;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
.hewan-m.hop{animation:hop .7s ease-out}
.sq .qt{font-weight:800;font-size:16px;margin-bottom:8px}
.sq .opt{margin-bottom:7px}

/* ---------- pemutar animasi Angka ---------- */
.applayer{background:#fff;border-radius:22px;box-shadow:0 8px 22px rgba(122,91,181,.25);overflow:hidden;border:3px solid var(--c,#7a5bb5);margin:12px 0}
.apstage{position:relative;min-height:300px;padding:14px 10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:repeating-linear-gradient(#fff 0 31px,#efe9fb 31px 32px);text-align:center}
.aphead{font-weight:900;font-size:22px;line-height:1.1;color:#3b2a63}
.aprow{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:8px 10px;max-width:100%}
.apt{display:flex;flex-direction:column;align-items:center;font-size:36px;line-height:1;opacity:0;transform:scale(.2);animation:appop .5s cubic-bezier(.3,1.6,.5,1) forwards;position:relative}
.apt b{font-size:14px;color:#6b5a93;margin-top:3px;font-weight:800;min-height:17px}
.apt.big{font-size:78px}
.apt.num{font-size:40px;font-weight:900;color:var(--c,#7a5bb5)}
.apt.ev{color:#e05252}.apt.od{color:#2f8fd1}
.apt.op{font-size:30px;font-weight:900;color:#6b5a93}

{n:'Gunung Meletus',ic:'volcano',fx:'bubbles',col:'#e8793a',mats:['Gelas bekas atau botol kecil','Baking soda 2 sendok makan','Cuka 1/2 gelas','Pewarna makanan merah','Sedikit sabun cuci piring','Nampan'],steps:['Taruh gelas di tengah nampan.','Masukkan baking soda dan setetes sabun cuci piring.','Teteskan pewarna merah supaya lavanya berwarna.','Tuang cuka perlahan, lalu lihat gunungnya meletus!'],why:'Baking soda bertemu cuka dan menghasilkan gas karbon dioksida (CO₂). Gas itu membentuk gelembung yang mendorong busa keluar dari gelas, seperti lava.'},
{n:'Balon Mengembang',ic:'balon',fx:'bubbles',col:'#c2417a',mats:['Botol plastik kecil','Balon','Cuka 1/4 gelas','Baking soda 2 sendok teh','Corong atau kertas yang digulung'],steps:['Tuang cuka ke dalam botol.','Pakai corong untuk memasukkan baking soda ke dalam balon.','Pasang mulut balon di leher botol dengan hati-hati.','Angkat balon supaya baking soda jatuh ke botol, lalu lihat balonnya menggembung.'],why:'Reaksi cuka dan baking soda menghasilkan gas CO₂. Gas itu naik dan mengisi balon sehingga balon mengembang tanpa ditiup.'},
{n:'Susu Pelangi',ic:'susu',fx:'spark',col:'#7a3fa0',mats:['Piring cekung','Susu cair secukupnya','Pewarna makanan beberapa warna','Sabun cuci piring','Kapas lidi (cotton bud)'],steps:['Tuang susu ke piring sampai menutupi dasar.','Teteskan beberapa warna pewarna di permukaan susu.','Celupkan ujung cotton bud ke sabun cuci piring.','Sentuh susu dengan cotton bud tadi dan lihat warnanya menari.'],why:'Sabun mengurangi tegangan permukaan dan menarik lemak di susu. Lemak yang bergerak ikut membawa pewarna, jadi warnanya berputar seperti pelangi.'},
{n:'Telur Mengapung',ic:'telur',fx:'bubbles',col:'#1b7fa0',mats:['2 gelas bening','Air biasa','Garam sekitar 6 sendok makan','1 sendok pengaduk','2 butir telur mentah'],steps:['Isi kedua gelas dengan air sampai 3/4 penuh.','Masukkan garam ke satu gelas dan aduk sampai larut.','Letakkan telur pelan-pelan di gelas air biasa. Telur tenggelam.','Letakkan telur di gelas air garam. Telur mengapung!'],why:'Garam yang larut membuat air lebih padat (massa jenis naik). Kalau air lebih padat dari telur, telur terdorong ke atas dan mengapung.'},
{n:'Roket Balon',ic:'roket',fx:'slide',col:'#c2417a',mats:['Benang panjang 3 sampai 4 meter','Sedotan','Balon','Selotip','Dua kursi sebagai tiang'],steps:['Masukkan benang ke sedotan, lalu ikat kedua ujung benang di dua kursi sampai tegang.','Tiup balon, jepit ujungnya, lalu tempelkan balon di sedotan dengan selotip.','Hitung mundur 3, 2, 1.','Lepaskan jepitan dan lihat roketnya meluncur.'],why:'Udara keluar ke belakang, dan balon terdorong ke depan. Ini disebut aksi dan reaksi: setiap dorongan punya dorongan lawan yang arahnya berlawanan.'},
{n:'Bunga Berubah Warna',ic:'bunga',fx:'spark',col:'#d1478a',mats:['Bunga putih (mawar, krisan, atau seruni)','Gelas berisi air','Pewarna makanan pekat','Gunting (dipegang orang dewasa)'],steps:['Isi gelas dengan air dan teteskan banyak pewarna.','Minta orang dewasa memotong ujung tangkai bunga miring.','Masukkan bunga ke gelas.','Tunggu 1 hari dan lihat kelopaknya berubah warna.'],why:'Tangkai punya pembuluh kecil yang menyedot air ke atas sampai kelopak. Air membawa pewarna, jadi kelopak putih ikut berwarna.'},
{n:'Lampu Lava',ic:'lava',fx:'bubbles',col:'#c83b6b',mats:['Botol bening','Minyak goreng 3/4 botol','Air 1/4 botol','Pewarna makanan','Tablet effervescent (jangan dimakan)'],steps:['Isi botol dengan minyak, lalu tuang air perlahan.','Teteskan pewarna dan tunggu sampai turun ke lapisan air.','Masukkan setengah tablet effervescent.','Lihat gelembung lava naik turun. Boleh tambah tablet lagi.'],why:'Minyak lebih ringan dari air, jadi tidak bercampur dan selalu di atas. Gelembung gas dari tablet mengangkat air berwarna ke atas, lalu turun lagi saat gasnya lepas.'},
{n:'Pelangi di Kertas',ic:'kertas',fx:'spark',col:'#7a3fa0',mats:['Kertas saring atau tisu dapur','Spidol berwarna yang larut air','Gelas berisi sedikit air','Gunting'],steps:['Gunting kertas menjadi strip panjang.','Gambar titik berwarna dekat salah satu ujung strip.','Celupkan ujung strip ke air, titik tidak boleh terendam.','Tunggu beberapa menit dan lihat warnanya terpisah menjadi beberapa warna.'],why:'Air merambat naik lewat serat kertas dan membawa warna tinta. Setiap warna punya kecepatan berbeda, jadi warna campuran terpisah.'}],
 bonus:[

    const end=/[!?]$/.test(sen)?sen.slice(-1):'.';

    const out=[];ph.forEach(x=>{const w=x.split(/\s+/);if(w.length>7){const h=Math.ceil(w.length/2);out.push(w.slice(0,h).join(' '),w.slice(h).join(' '))}else out.push(x)});
    ph=out;const n=ph.length,list=n>=3&&ph.every(x=>x.split(/\s+/).length<=2);

const MUS={ctx:null,g:null,timer:null,step:0,next:0,want:true,duck:false,started:false};
const MEL=[72,0,76,0,79,76,72,0,74,0,77,0,81,77,74,0,76,0,79,0,83,79,76,0,79,77,76,74,72,0,0,0];
const BAS=[48,53,55,48];
const mhz=m=>440*Math.pow(2,(m-69)/12);
function musNote(m,t,d,type,vol){const o=MUS.ctx.createOscillator(),g=MUS.ctx.createGain();o.type=type;o.frequency.value=mhz(m);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MUS.g);o.start(t);o.stop(t+d+0.05)}
function musTick(){if(!MUS.ctx)return;const e=0.27;while(MUS.next<MUS.ctx.currentTime+0.3){const i=MUS.step%32,t=MUS.next;
  if(MEL[i])musNote(MEL[i],t,e*1.6,'triangle',0.5);
  if(i%4===0)musNote(BAS[Math.floor(i/8)]-12+(i%8===4?7:0),t,e*2.2,'sine',0.45);
  if(i%2===0)musNote(96,t,0.05,'square',0.03);
  MUS.next+=e;MUS.step++}}
function musApply(){if(!MUS.g)return;const on=MUS.want&&!MUS.duck&&!document.hidden;MUS.g.gain.setTargetAtTime(on?0.16:0.0001,MUS.ctx.currentTime,0.15);$('#mbtn').classList.toggle('off',!MUS.want)}
function musStart(){try{if(!MUS.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;MUS.ctx=new C();MUS.g=MUS.ctx.createGain();MUS.g.gain.value=0.0001;MUS.g.connect(MUS.ctx.destination)}
  if(MUS.ctx.state==='suspended')MUS.ctx.resume();
  if(!MUS.timer){MUS.next=MUS.ctx.currentTime+0.1;MUS.timer=setInterval(musTick,50)}
  MUS.started=true;musApply()}catch(e){}}
function musDuck(d){MUS.duck=d;musApply()}
$('#mbtn').onclick=e=>{e.stopPropagation();MUS.want=!MUS.want;if(MUS.want)musStart();musApply();say(MUS.want?'Musik menyala.':'Musik dimatikan.')};
